[versions]
agp = "8.9.1"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
hilt = "2.56"
hiltNavCompose = "1.2.0"
composeBom = "2025.05.00"
activityCompose = "1.10.1"
navCompose = "2.9.0"
lifecycle = "2.9.0"
coreKtx = "1.16.0"
junit = "4.13.2"
room = "2.7.1"
work = "2.10.1"
playLocation = "21.3.0"
